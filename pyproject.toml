[project]
name = "llm-wiki"
version = "0.1.0"
description = "Local-first LLM wiki with Markdown ingestion and SQLite FTS search."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=14.0.0",
    "typer>=0.21.0",
]

[project.scripts]
llm-wiki = "llm_wiki.cli:app"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"
reportAny = "none"
# Wrapping console messages inside parentheses is how they stay under
# ruff's 88-column limit, and ruff already allows ISC001.
reportImplicitStringConcatenation = "none"

# Tests assert on behavior, not on the types of discarded call results or of
# JSON payloads they construct themselves.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportUnusedCallResult = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportMissingTypeArgument = "none"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Typer maps one CLI option to one parameter, so command signatures are wide.
    "PLR0913",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Hook scripts are emitted verbatim as string templates; wrapping them would
# change the generated file rather than this module's readability.
"src/llm_wiki/hook_templates.py" = ["E501"]
"tests/**/*.py" = [
    "S101",
    "ARG",
    "PLR2004",
    "SLF001",
    "D",
    # Integration tests intentionally run the installed CLI in a subprocess.
    "S603",
    "PLW1510",
    "PLC0415",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
